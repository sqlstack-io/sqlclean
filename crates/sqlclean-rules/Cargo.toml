[package]
name = "sqlclean-rules"
version.workspace = true
description = "SQLClean's built-in Rules over SQLQuack's located syntax trees."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

# A Rule is handed a tree and never SQL or tokens. sqlquack-syntax holds the tree and no tokenizer or
# parser (those are in sqlquack-tokenize and the parser crates), and `make check-rust` fails if any
# crate these depend on reaches one. A Rule that needs more is missing a fact or a position, which
# belongs in SQLQuack.
[dependencies]
sqlquack-syntax.workspace = true

[lints]
workspace = true
