[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sqlclean-cli"
version = "0.3.0" # x-release-please-version
description = "Native command-line executable for SQLClean"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/sqlstack-io/sqlclean"
Issues = "https://github.com/sqlstack-io/sqlclean/issues"
Repository = "https://github.com/sqlstack-io/sqlclean"

[tool.maturin]
bindings = "bin"
manifest-path = "../../crates/sqlclean-cli/Cargo.toml"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "../../Cargo.toml" },
  { file = "../../Cargo.lock" },
  { file = "../../crates/*/Cargo.toml" },
  { file = "../../crates/*/src/**/*.rs" },
  { file = "../../crates/sqlclean-cli/skill/**/*.md" },
]
